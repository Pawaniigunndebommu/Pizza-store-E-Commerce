<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzO - Pizza Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">pizz<span>O</span></div>

    <nav>
        <a href="#home">Tasty</a>
        <a href="#pizzas">Spicy</a>
        <a href="#pizzas">Delicious</a>
        <a href="#pizzas">Yummy</a>
    </nav>

    <div class="nav-icons">
        <button id="searchBtn">⌕</button>

        <button id="cartBtn" class="cart-icon">
            🛒
            <span id="cartCount">0</span>
        </button>
    </div>
</header>


<!-- HERO -->
<section class="hero" id="home">

    <div class="hero-content">
        <p>Are You Hungry?</p>
        <h1>Don't Wait.</h1>
        <h3>Let's start to order food now</h3>

        <button class="menu-btn" id="menuBtn">
            Check Out Menu
        </button>
    </div>

    <div class="hero-image">
        <img id="heroPizza"
             src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=90"
             alt="Pizza">
    </div>
</section>


<!-- SLIDER CIRCLES -->
<div class="slider">
    <button class="slide-circle active"
            data-image="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=90">
        <img src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=150&q=80">
    </button>

    <button class="slide-circle"
            data-image="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=700&q=90">
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=150&q=80">
    </button>

    <!-- 3RD CIRCLE - FIXED -->
    <button class="slide-circle"
            data-image="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=700&q=90">
        <img src="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=150&q=80"
             alt="Pizza">
    </button>

    <button class="slide-circle"
            data-image="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=700&q=90">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=150&q=80">
    </button>
</div>


<!-- PIZZAS -->
<section class="pizza-section" id="pizzas">

    <div class="section-heading">
        <h2>🍕 Our Pizzas</h2>
        <p>Choose your favourite pizza</p>
    </div>

    <div class="pizza-grid" id="pizzaGrid"></div>

</section>


<!-- CART -->
<div class="cart-overlay" id="cartOverlay"></div>

<div class="cart-box" id="cartBox">

    <div class="cart-header">
        <h2>🛒 Your Cart</h2>
        <button id="closeCart">✕</button>
    </div>

    <div id="cartItems" class="cart-items">
        <p class="empty-cart">Your cart is empty.</p>
    </div>

    <div class="cart-footer">
        <h3>Total: ₹<span id="cartTotal">0</span></h3>
        <button id="checkoutBtn">Checkout</button>
    </div>

</div>


<script src="script.js"></script>

</body>
</html>
