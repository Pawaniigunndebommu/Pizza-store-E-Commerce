<script>

/* ==========================================
   CART - FIX
   ========================================== */

let cart = [];

function addToCart(name, price) {

    let existing = cart.find(item => item.name === name);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            name: name,
            price: price,
            quantity: 1
        });
    }

    updateCart();

    const panel = document.getElementById("cartPanel");

    if (panel) {
        panel.classList.add("active");
    }
}


function buyNow(name, price) {

    cart = [{
        name: name,
        price: price,
        quantity: 1
    }];

    updateCart();

    const panel = document.getElementById("cartPanel");

    if (panel) {
        panel.classList.add("active");
    }
}


function updateCart() {

    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");
    const cartCount = document.getElementById("cartCount");

    if (!cartItems) return;

    cartItems.innerHTML = "";

    let total = 0;
    let count = 0;

    if (cart.length === 0) {

        cartItems.innerHTML =
            '<p class="empty-cart">Your cart is empty.</p>';

    } else {

        cart.forEach((item, index) => {

            total += item.price * item.quantity;
            count += item.quantity;

            cartItems.innerHTML += `
                <div class="cart-item">

                    <div>
                        <h4>${item.name}</h4>
                        <p>₹${item.price} × ${item.quantity}</p>
                    </div>

                    <div>

                        <button onclick="decreaseItem(${index})">
                            −
                        </button>

                        <span>${item.quantity}</span>

                        <button onclick="increaseItem(${index})">
                            +
                        </button>

                        <button onclick="removeItem(${index})">
                            ✕
                        </button>

                    </div>

                </div>
            `;
        });
    }

    if (cartTotal) {
        cartTotal.textContent = total;
    }

    if (cartCount) {
        cartCount.textContent = count;
    }
}


function increaseItem(index) {

    cart[index].quantity++;

    updateCart();
}


function decreaseItem(index) {

    cart[index].quantity--;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    updateCart();
}


function removeItem(index) {

    cart.splice(index, 1);

    updateCart();
}


/* ==========================================
   OPEN / CLOSE CART
   ========================================== */

document.getElementById("cartBtn").onclick = function () {

    document.getElementById("cartPanel").classList.add("active");

};


document.getElementById("closeCart").onclick = function () {

    document.getElementById("cartPanel").classList.remove("active");

};


/* ==========================================
   CHECKOUT
   ========================================== */

function checkout() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;
    }

    let total = 0;

    cart.forEach(item => {
        total += item.price * item.quantity;
    });

    alert(
        "Order placed successfully!\n\n" +
        "Total Amount: ₹" + total
    );

    cart = [];

    updateCart();

    document.getElementById("cartPanel")
        .classList.remove("active");
}


/* ==========================================
   3RD CIRCLE PHOTO - FIX
   ========================================== */

document.addEventListener("DOMContentLoaded", function () {

    const heroImg = document.getElementById("heroImg");

    const dots = document.querySelectorAll(".dot");


    /* Use the SAME working pizza image
       that is already displaying correctly */

    const images = [

        "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=80",

        "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=700&q=80",

        "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=80",

        "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=700&q=80"

    ];


    dots.forEach(function (dot, index) {

        /* Put actual picture inside every circle */

        dot.style.backgroundImage =
            "url('" + images[index] + "')";

        dot.style.backgroundSize = "cover";

        dot.style.backgroundPosition = "center";

        dot.style.backgroundRepeat = "no-repeat";


        /* Click circle */

        dot.onclick = function () {

            heroImg.src = images[index];

            dots.forEach(function (d) {
                d.classList.remove("active");
            });

            dot.classList.add("active");

        };

    });


    /* FORCE 3RD CIRCLE */

    if (dots[2]) {

        dots[2].style.backgroundImage =
            "url('https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=80')";

        dots[2].style.backgroundSize = "cover";

        dots[2].style.backgroundPosition = "center";

        dots[2].style.backgroundRepeat = "no-repeat";

    }


    updateCart();

});

</script>
